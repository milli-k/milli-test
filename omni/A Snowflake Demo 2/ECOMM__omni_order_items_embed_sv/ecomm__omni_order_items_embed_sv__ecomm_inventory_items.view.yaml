# Reference this view as ecomm__omni_order_items_embed_sv__ecomm_inventory_items
# View is defined in the semantic view omni_order_items_embed_sv in the data warehouse
#This description was pulled from dbt.
description: Dimension table containing information about inventory items

schema: ECOMM
folder: ECOMM/omni_order_items_embed_sv
table_name: INVENTORY_ITEMS

dimensions:
  id:
    # Dimension is defined in the semantic view omni_order_items_embed_sv in the data warehouse
    sql: '"ID"'
    format: ID
    #This description was pulled from dbt.
    description: Unique identifier for each inventory item
    primary_key: true

  product_id:
    # Dimension is defined in the semantic view omni_order_items_embed_sv in the data warehouse
    sql: '"PRODUCT_ID"'
    format: ID
    #This description was pulled from dbt.
    description: Identifier of the associated product

  created_at:
    # Dimension is defined in the semantic view omni_order_items_embed_sv in the data warehouse
    sql: '"CREATED_AT"'
    #This description was pulled from dbt.
    description: Timestamp when the inventory item was created

  sold_at:
    # Dimension is defined in the semantic view omni_order_items_embed_sv in the data warehouse
    sql: '"SOLD_AT"'
    #This description was pulled from dbt.
    description: Timestamp when the item was sold

  cost:
    # Dimension is defined in the semantic view omni_order_items_embed_sv in the data warehouse
    sql: '"COST"'
    #This description was pulled from dbt.
    description: Cost of the inventory item

  product_category:
    # Dimension is defined in the semantic view omni_order_items_embed_sv in the data warehouse
    sql: '"PRODUCT_CATEGORY"'
    #This description was pulled from dbt.
    description: Category of the product

  product_name:
    # Dimension is defined in the semantic view omni_order_items_embed_sv in the data warehouse
    sql: '"PRODUCT_NAME"'
    #This description was pulled from dbt.
    description: Name of the product

  product_brand:
    # Dimension is defined in the semantic view omni_order_items_embed_sv in the data warehouse
    sql: '"PRODUCT_BRAND"'
    #This description was pulled from dbt.
    description: Brand of the product

  product_retail_price:
    # Dimension is defined in the semantic view omni_order_items_embed_sv in the data warehouse
    sql: '"PRODUCT_RETAIL_PRICE"'
    #This description was pulled from dbt.
    description: Retail price of the product

  product_department:
    # Dimension is defined in the semantic view omni_order_items_embed_sv in the data warehouse
    sql: '"PRODUCT_DEPARTMENT"'
    #This description was pulled from dbt.
    description: Department the product belongs to

  product_sku:
    # Dimension is defined in the semantic view omni_order_items_embed_sv in the data warehouse
    sql: '"PRODUCT_SKU"'
    #This description was pulled from dbt.
    description: Stock Keeping Unit of the product

  product_distribution_center_id:
    # Dimension is defined in the semantic view omni_order_items_embed_sv in the data warehouse
    sql: '"PRODUCT_DISTRIBUTION_CENTER_ID"'
    format: ID
    #This description was pulled from dbt.
    description: Identifier of the distribution center for the product

  days_in_inventory:
    # Dimension is defined in the semantic view omni_order_items_embed_sv in the data warehouse
    sql: CASE WHEN "SOLD_AT" IS NULL THEN DATEDIFF(DAY, "CREATED_AT", CURRENT_DATE)
      ELSE DATEDIFF(DAY, "CREATED_AT", "SOLD_AT") END

measures:
  count:
    # Measure is defined in the semantic view omni_order_items_embed_sv in the data warehouse
    sql: COUNT(DISTINCT "ID")

  cost_sum:
    # Measure is defined in the semantic view omni_order_items_embed_sv in the data warehouse
    sql: SUM("COST")

  days_in_inventory_average:
    # Measure is defined in the semantic view omni_order_items_embed_sv in the data warehouse
    sql: AVG("DAYS_IN_INVENTORY")

  inventory_volume:
    # Measure is defined in the semantic view omni_order_items_embed_sv in the data warehouse
    sql: COUNT(DISTINCT "ID")

  product_retail_price_average:
    # Measure is defined in the semantic view omni_order_items_embed_sv in the data warehouse
    sql: AVG("PRODUCT_RETAIL_PRICE")

  test_measure:
    # Measure is defined in the semantic view omni_order_items_embed_sv in the data warehouse
    sql: SUM((uniform(1, 2.01::number(10,2), RANDOM())))

#The info below was pulled from your dbt repository and is read-only.
