# Reference this view as fhir__int_fhir__allergies
schema: FHIR
table_name: INT_FHIR__ALLERGIES

dimensions:
  asserted_ts:
    sql: '"ASSERTED_TS"'

  patient_id:
    sql: '"PATIENT_ID"'
    format: ID

  code:
    sql: '"CODE"'

  category:
    sql: '"CATEGORY"'

  description:
    sql: '"DESCRIPTION"'

  type:
    sql: '"TYPE"'

  criticality:
    sql: '"CRITICALITY"'

  clinical_status:
    sql: '"CLINICAL_STATUS"'

  resource_raw:
    sql: '"RESOURCE_RAW"'

measures:
  count:
    aggregate_type: count

#The info below was pulled from your dbt repository and is read-only.
dbt:
  name: int_fhir__allergies
  target_schema: demo
  config:
    schema: fhir
    materialized: table
  code: |-
    select
      timestampadd(year, extract(year, current_date()) - 2016, asserted_ts) as asserted_ts,
      {{ dbt_utils.star(ref('stg_fhir__allergies'), except=["asserted_ts"]) }}
    from {{ ref('stg_fhir__allergies') }}
    where 1=1
        and timestampadd(year, extract(year, current_date()) - 2016, asserted_ts)
        < current_date()
  referenced_by: [ allergies ]
