# Reference this view as omni_dbt_ecomm__sales__products
# View is defined in the semantic view SALES in the data warehouse
schema_label: ""
#This description was pulled from dbt.
description: Dimension table containing information about products

schema: omni_dbt_ecomm
folder: ECOMM/sales
table_name: PRODUCTS

dimensions:
  id:
    # Dimension is defined in the semantic view SALES in the data warehouse
    sql: '"ID"'
    format: ID
    #This description was pulled from dbt.
    description: Unique identifier for each product
    primary_key: true

  cost:
    # Dimension is defined in the semantic view SALES in the data warehouse
    sql: '"COST"'
    #This description was pulled from dbt.
    description: Cost of the product
    synonyms: [ base cost, product cost, wholesale price ]

  category:
    # Dimension is defined in the semantic view SALES in the data warehouse
    sql: '"CATEGORY"'
    #This description was pulled from dbt.
    description: Category of the product
    synonyms: [ item type, merchandise type, product category ]

  name:
    # Dimension is defined in the semantic view SALES in the data warehouse
    sql: '"NAME"'
    #This description was pulled from dbt.
    description: Name of the product
    synonyms: [ item name, product name, title ]

  brand:
    # Dimension is defined in the semantic view SALES in the data warehouse
    sql: '"BRAND"'
    #This description was pulled from dbt.
    description: Brand of the product
    synonyms: [ label, make, manufacturer, product brand ]

  retail_price:
    # Dimension is defined in the semantic view SALES in the data warehouse
    sql: '"RETAIL_PRICE"'
    #This description was pulled from dbt.
    description: Retail price of the product
    synonyms: [ full price, list price, msrp, recommended price ]

  department:
    # Dimension is defined in the semantic view SALES in the data warehouse
    sql: '"DEPARTMENT"'
    #This description was pulled from dbt.
    description: Department the product belongs to
    synonyms: [ business segment, division, product department ]

  sku:
    # Dimension is defined in the semantic view SALES in the data warehouse
    sql: '"SKU"'
    #This description was pulled from dbt.
    description: Stock Keeping Unit of the product
    synonyms: [ item code, product code, product sku ]

  distribution_center_id:
    # Dimension is defined in the semantic view SALES in the data warehouse
    sql: '"DISTRIBUTION_CENTER_ID"'
    format: ID
    #This description was pulled from dbt.
    description: Identifier of the distribution center for the product

measures:
  count:
    aggregate_type: count

  total_cost:
    # Measure is defined in the semantic view SALES in the data warehouse
    sql: SUM(${omni_dbt_ecomm__sales__products.cost})
    description: Total product costs from the product master, useful for cost
      variance analysis.
    synonyms: [ merchandise cost, product costs ]

  unique_brands_sold:
    # Measure is defined in the semantic view SALES in the data warehouse
    sql: COUNT(DISTINCT ${omni_dbt_ecomm__sales__products.brand})
    description: Number of unique brands represented in sales, useful for brand
      portfolio analysis.
    synonyms: [ brand count, brand variety ]

  unique_products_sold:
    # Measure is defined in the semantic view SALES in the data warehouse
    sql: COUNT(DISTINCT ${omni_dbt_ecomm__sales__products.id})
    description: Number of unique products/SKUs sold, indicating catalog breadth and
      product diversity.
    synonyms: [ product count, product variety, sku count ]

#The info below was pulled from your dbt repository and is read-only.
dbt:
  name: products
  target_schema: demo
  description: Dimension table containing information about products
  config:
    schema: ecomm
    materialized: table
  code: |-
    select
      {{ dbt_utils.star(ref('stg_ecomm__products')) }}
    from {{ ref('stg_ecomm__products') }}
