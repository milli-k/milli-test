# Reference this view as saas__opportunities_sv__account
# View is defined in the semantic view OPPORTUNITIES_SV in the data warehouse
#This description was pulled from dbt.
description: Table describing accounts for the data company Blobby Data

schema: SAAS
folder: SAAS/opportunities_sv
table_name: ACCOUNT

dimensions:
  id:
    # Dimension is defined in the semantic view OPPORTUNITIES_SV in the data warehouse
    sql: '"ID"'
    format: ID
    #This description was pulled from dbt.
    description: Unique identifier for an account
    primary_key: true

  name:
    # Dimension is defined in the semantic view OPPORTUNITIES_SV in the data warehouse
    sql: '"NAME"'
    #This description was pulled from dbt.
    description: Account company name
    synonyms: [ company_name, account_name, organization_name ]

  type:
    # Dimension is defined in the semantic view OPPORTUNITIES_SV in the data warehouse
    sql: '"TYPE"'
    #This description was pulled from dbt.
    description: Identifier is the account is a customer, prospect or partner
    synonyms: [ account_type, account_status, customer_type ]

  billing_street:
    # Dimension is defined in the semantic view OPPORTUNITIES_SV in the data warehouse
    sql: '"BILLING_STREET"'
    #This description was pulled from dbt.
    description: Account billing street

  billing_state:
    # Dimension is defined in the semantic view OPPORTUNITIES_SV in the data warehouse
    sql: '"BILLING_STATE"'
    #This description was pulled from dbt.
    description: Account billing state
    synonyms: [ state, billing_state_province ]

  billing_city:
    # Dimension is defined in the semantic view OPPORTUNITIES_SV in the data warehouse
    sql: '"BILLING_CITY"'
    #This description was pulled from dbt.
    description: Account billing city
    synonyms: [ city, billing_city_name ]

  billing_zip:
    # Dimension is defined in the semantic view OPPORTUNITIES_SV in the data warehouse
    sql: '"BILLING_ZIP"'
    #This description was pulled from dbt.
    description: Account billing zip code
    synonyms: [ zip_code, postal_code, billing_postal_code ]

  billing_country:
    # Dimension is defined in the semantic view OPPORTUNITIES_SV in the data warehouse
    sql: '"BILLING_COUNTRY"'
    #This description was pulled from dbt.
    description: Account billing country
    synonyms: [ country, billing_country_name ]

  region:
    # Dimension is defined in the semantic view OPPORTUNITIES_SV in the data warehouse
    sql: '"REGION"'
    #This description was pulled from dbt.
    description: Region owner of the account (NA, EMEA, APAC)
    synonyms: [ sales_region, geographic_region, territory_region ]

  industry:
    # Dimension is defined in the semantic view OPPORTUNITIES_SV in the data warehouse
    sql: '"INDUSTRY"'
    #This description was pulled from dbt.
    description: Industry the account operates in
    synonyms: [ industry_vertical, sector, business_industry ]

  annual_revenue:
    # Dimension is defined in the semantic view OPPORTUNITIES_SV in the data warehouse
    sql: '"ANNUAL_REVENUE"'
    #This description was pulled from dbt.
    description: The account's annual operating revenue
    synonyms: [ revenue, company_revenue, annual_revenue_amount ]

  number_of_employees:
    # Dimension is defined in the semantic view OPPORTUNITIES_SV in the data warehouse
    sql: '"NUMBER_OF_EMPLOYEES"'
    #This description was pulled from dbt.
    description: The number of employees at an account.  Used for segmentation

  segment:
    # Dimension is defined in the semantic view OPPORTUNITIES_SV in the data warehouse
    sql: '"SEGMENT"'
    #This description was pulled from dbt.
    description: Segment the account belongs to. Enterprise, Commercial or SMB.
    synonyms: [ account_segment, customer_segment, company_size_segment ]

  owner_id:
    # Dimension is defined in the semantic view OPPORTUNITIES_SV in the data warehouse
    sql: '"OWNER_ID"'
    format: ID
    #This description was pulled from dbt.
    description: Unique identifier for the account owner
    synonyms: [ account_owner_id, sales_rep_id ]

  created_date:
    # Dimension is defined in the semantic view OPPORTUNITIES_SV in the data warehouse
    sql: '"CREATED_DATE"'
    #This description was pulled from dbt.
    description: SFDC account created date
    synonyms: [ account_created_date, creation_date, account_creation_date ]

  csm_id:
    # Dimension is defined in the semantic view OPPORTUNITIES_SV in the data warehouse
    sql: '"CSM_ID"'
    format: ID
    description: Customer success manager ID

measures:
  count:
    # Measure is defined in the semantic view OPPORTUNITIES_SV in the data warehouse
    sql: COUNT(*)
    description: Count of accounts
    synonyms: [ account_count, total_accounts, number_of_accounts ]

  customer_count:
    # Measure is defined in the semantic view OPPORTUNITIES_SV in the data warehouse
    sql: COUNT(CASE WHEN "TYPE" = 'Customer' THEN 1 ELSE NULL END)
    description: Count of accounts that are customers
    synonyms: [ customers, total_customers, number_of_customers ]

