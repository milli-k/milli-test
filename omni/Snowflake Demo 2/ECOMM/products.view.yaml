# Reference this view as ecomm__products
#This description was pulled from dbt.
description: Dimension table containing information about products

schema: ECOMM
table_name: PRODUCTS

dimensions:
  id:
    sql: '"ID"'
    format: ID
    #This description was pulled from dbt.
    description: Unique identifier for each product
    primary_key: true

  cost:
    sql: '"COST"'
    description: The cost to acquire/produce the product
    synonyms: [ product cost, COGS, cost of goods ]

  category:
    sql: '"CATEGORY"'
    description: Product category (e.g., Jeans, Sweaters, Accessories, Swim, etc.)
    synonyms: [ product category, type, product type, item category ]

  name:
    sql: '"NAME"'
    #This description was pulled from dbt.
    description: Name of the product
    synonyms: [ product name, item name, product title ]

  brand:
    sql: '"BRAND"'
    #This description was pulled from dbt.
    description: Brand of the product
    synonyms: [ manufacturer, product brand, maker ]

  retail_price:
    sql: '"RETAIL_PRICE"'
    description: The listed retail price of the product in USD
    synonyms: [ list price, MSRP, sticker price, price ]

  department:
    sql: '"DEPARTMENT"'
    description: High-level department the product belongs to (e.g., Men, Women)
    synonyms: [ product department, division, gender department ]

  sku:
    sql: '"SKU"'
    description: Stock Keeping Unit identifier for the product
    synonyms: [ product SKU, stock number, item number ]

  distribution_center_id:
    sql: '"DISTRIBUTION_CENTER_ID"'
    format: ID
    #This description was pulled from dbt.
    description: Identifier of the distribution center for the product
    hidden: true

measures:
  count:
    description: Total number of distinct products
    aggregate_type: count
    synonyms: [ product count, number of products, catalog size ]

#The info below was pulled from your dbt repository and is read-only.
dbt:
  name: products
  target_schema: demo
  description: Dimension table containing information about products
  config:
    schema: ecomm
    materialized: table
  code: |-
    select
      {{ dbt_utils.star(ref('stg_ecomm__products')) }}
    from {{ ref('stg_ecomm__products') }}
